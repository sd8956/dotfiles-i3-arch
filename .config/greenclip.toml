# Clipboard history for rofi ($mod+v). The history stays on this machine
# (~/.cache), never in the dotfiles repo.

[greenclip]
  history_file = "~/.cache/greenclip.history"
  max_history_length = 50
  max_selection_size_bytes = 0
  trim_space_from_selection = true
  use_primary_selection_as_input = false
  # Never record what password managers copy (matched by window class)
  blacklisted_applications = ["KeePassXC", "keepassxc", "Bitwarden", "bitwarden", "1Password", "1password"]
  enable_image_support = true
  image_cache_directory = "/tmp/greenclip"
  static_history = []
