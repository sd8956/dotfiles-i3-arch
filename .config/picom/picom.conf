# --- Motor Gráfico ---
backend = "glx";
#glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
vsync = true;
use-damage = false;

# Fullscreen windows (games) bypass the compositor: no blur/shadow/animation
# cost and no added input latency while playing.
unredir-if-possible = true;

# --- Transparencia ---
active-opacity = 1.0;
inactive-opacity = 0.85;
frame-opacity = 1.0;

# Excepciones de transparencia (para que no afecte a Chrome o videos)
opacity-rule = [
    "100:class_g = 'Google-chrome'",
    "100:class_g = 'feh'",
    "100:class_g = 'Plank'",  # The dock is never focused: keep it fully opaque
    "100:class_i = 'lock-osd'"  # Caps/Num Lock OSD draws its own translucency
];

# --- Esquinas Redondeadas ---
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "class_g = 'Polybar'" # Para que la barra siga recta
];

# --- Efecto Blur (Cristal difuminado) ---
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;

# The dock (Polybar) is blurred on purpose: macOS-style frosted menu bar.
blur-background-exclude = [
    "class_g = 'Plank'",  # Plank's window is larger than the dock (zoom area)
    "class_g = 'slop'"    # ¡Súper importante para que maim funcione bien!
];

# --- Soft shadows (macOS-style window depth) ---
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
shadow-offset-x = -15;
shadow-offset-y = -10;
shadow-exclude = [
    "window_type = 'dock'",
    "class_g = 'Polybar'",
    "class_g = 'slop'",
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS@"
];

# --- Animaciones de aparición (Fading) ---
fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.03;

# --- Window animations (open/close/move/resize) ---
animations = (
    {
        triggers = [ "open", "show" ];
        preset = "appear";
        scale = 0.95;
        duration = 0.18;
    },
    {
        triggers = [ "close", "hide" ];
        preset = "disappear";
        scale = 0.95;
        duration = 0.15;
    },
    {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.2;
    }
);
