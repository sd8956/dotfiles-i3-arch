; macOS-style menu bar (TokyoNight palette).
; Left: logo (app launcher) + focused app name + workspaces.
; Right: tray, indicators, system stats, volume, date and control menu.

[colors]
; Translucent background: picom blurs it like the macOS menu bar.
background = #e61a1b26
background-alt = #24283b
foreground = #c0caf5
muted = #a9b1d6
primary = #7aa2f7
secondary = #2ac3de
purple = #bb9af7
alert = #f7768e
disabled = #565f89

[bar/mi_barra]
monitor = ${env:MONITOR:}
width = 100%
height = 22pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 0
border-size = 0
border-color = #00000000

padding-left = 2
padding-right = 2
module-margin = 2

; No separators: macOS uses spacing only.
separator =

; T1 regular text, T2 icons, T3 bold app name, T4 Font Awesome fallback.
font-0 = "Adwaita Sans:size=11;3"
font-1 = "JetBrainsMono Nerd Font:size=12;3"
font-2 = "Adwaita Sans:weight=bold:size=11;3"
font-3 = "Font Awesome 6 Free Solid:size=11;3"

modules-left = launcher active-app xworkspaces
modules-right = tray xkeyboard cpu memory disk-root disk-data pulseaudio date powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/launcher]
type = custom/text
format = <label>
label = "%{T2}%{T-}"
label-foreground = ${colors.primary}
label-padding-right = 1
click-left = rofi -show drun -theme ~/.config/rofi/themes/launcher.rasi

[module/active-app]
type = custom/script
exec = ~/.config/polybar/scripts/active-app.sh
tail = true
format = <label>
label = %output:0:30:...%
label-font = 3
label-foreground = ${colors.foreground}
label-padding-right = 1

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-foreground = ${colors.primary}
label-active-font = 3
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.muted}
label-occupied-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-font = 3
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.foreground}
label-muted = 󰝟
label-muted-foreground = ${colors.disabled}
click-right = env GTK_THEME=Tokyonight-Dark pavucontrol

[module/memory]
type = internal/memory
interval = 2
format-prefix = "%{A1:ghostty -e btop:}󰍛 %{A}"
format-prefix-foreground = ${colors.muted}
label = %{A1:ghostty -e btop:}%percentage_used:2%%%{A}
label-foreground = ${colors.muted}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "%{A1:ghostty -e btop:}󰻠 %{A}"
format-prefix-foreground = ${colors.muted}
label = %{A1:ghostty -e btop:}%percentage:2%%%{A}
label-foreground = ${colors.muted}

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
date-alt = %A %d %B %Y
time-alt = %H:%M:%S
label = %date%  %time%
label-foreground = ${colors.foreground}

[module/powermenu]
type = custom/text
format = <label>
label = "%{T2}󰒓%{T-}"
label-foreground = ${colors.foreground}
label-padding-left = 1
click-left = ~/.config/rofi/control-center.sh

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = scroll lock

; Solo mostrar cuando están activados
format = <label-indicator>

; Diseño para Mayúsculas (Rojo TokyoNight)
label-indicator-on-capslock = "󰪛 MAYÚS "
label-indicator-on-capslock-foreground = ${colors.alert}

; Diseño para Num Lock (Azul TokyoNight)
label-indicator-on-numlock = "󰎦 NUM "
label-indicator-on-numlock-foreground = ${colors.primary}

[module/disk-root]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %{A1:gparted:}󱛟 %percentage_used%%%{A}
label-mounted-foreground = ${colors.purple}
click-left = sudo baobab

[module/disk-data]
type = internal/fs
interval = 25
mount-0 = /mnt/datos
label-mounted = %{A1:gparted:}󰋊 %percentage_used%%%{A}
label-mounted-foreground = ${colors.primary}

[module/tray]
type = internal/tray
format-margin = 4px
tray-spacing = 10px
tray-size = 60%

[settings]
screenchange-reload = true
; Real transparency through picom (needed for the blur behind the bar).
pseudo-transparency = false
