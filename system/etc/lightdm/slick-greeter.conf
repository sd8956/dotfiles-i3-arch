[Greeter]
# macOS-style login: same wallpaper and avatar as the lock screen, user centered
background=/usr/share/pixmaps/login_bg.jpg
background-color=#1a1b26
draw-user-backgrounds=false
draw-grid=false
content-align=center

# TokyoNight theme and the desktop's fonts
theme-name=TokyoNight
icon-theme-name=Papirus-Dark
font-name=Adwaita Sans 11

# Minimal top bar: 24h clock (same as the bar and the lock screen) and power
show-hostname=false
show-a11y=false
show-keyboard=false
show-power=true
show-clock=true
clock-format=%H:%M

# Num Lock on, as in the i3 session
activate-numlock=true
